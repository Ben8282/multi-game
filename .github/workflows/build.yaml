name: build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  PROJECT: ${{ github.event.repository.name }}
  # Every download bundles its own Python (with pygame) and Java, so users install nothing.
  PYTHON_VERSION: "3.14"
  PYTHON_PACKAGES: pygame-ce
  JDK_VERSION: "21" # newest LTS that Temurin ships for every target, Windows ARM64 included
  JLINK_MODULES: java.base,jdk.compiler # jdk.compiler is what `java File.java` needs
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGE_RUNTIME_VERSION: "20251108"

jobs:
  check:
    name: check java and python sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compile every Java source
        run: javac -d "$RUNNER_TEMP/classes" src/*.java

      - name: Byte-compile every Python script
        run: |
          python -m pip install --disable-pip-version-check $PYTHON_PACKAGES
          python -m compileall -q src

      - name: Check that every import resolves
        run: |
          for m in $(grep -rhoE '^\s*(import|from)\s+[A-Za-z_][A-Za-z0-9_]*' src --include='*.py' | awk '{print $2}' | sort -u); do
            [ -f "src/$m.py" ] && continue # a script in this repo
            python -c "import $m" || { echo "cannot import $m"; exit 1; }
            echo "ok: $m"
          done

      - name: Run every pygame game headless for 10 seconds
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          for s in $(grep -rl 'import pygame' src --include='*.py'); do
            echo "running $s"
            timeout 10 python "$s" && code=0 || code=$?
            [ "$code" -eq 124 ] || { echo "$s stopped early with exit code $code"; exit 1; }
          done

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl # static binary, runs on any Linux
          - name: linux-arm64
            runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: macos-x86_64
            runner: macos-26-intel
            target: x86_64-apple-darwin
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      - uses: astral-sh/setup-uv@v10.2.0 # setup-uv has no moving major tag, bump the exact version

      - name: Build and test the menu
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          cargo test --release --locked --target ${{ matrix.target }}

      - name: Bundle a Java runtime that can run .java files
        run: |
          jlink --add-modules "$JLINK_MODULES" --strip-debug --no-header-files --no-man-pages \
                --compress zip-6 --output payload/runtime/jvm
          payload/runtime/jvm/bin/java -version

      - name: Bundle a standalone Python with pygame
        run: |
          uv python install --install-dir pydist "$PYTHON_VERSION"
          mkdir -p payload/runtime
          mv pydist/cpython-"$PYTHON_VERSION".*/ payload/runtime/python
          if [ -x payload/runtime/python/bin/python3 ]; then
            PY=payload/runtime/python/bin/python3
          else
            PY=payload/runtime/python/python.exe
            cp "$PY" payload/runtime/python/python3.exe # the menu looks for python3
          fi
          "$PY" -m pip install --disable-pip-version-check --no-cache-dir --break-system-packages $PYTHON_PACKAGES

          # drop what a game bundle never needs: headers, tests, IDLE, Tk, pip
          (
            cd payload/runtime/python
            rm -rf include share tcl libs \
                   lib/python*/test lib/python*/idlelib lib/python*/tkinter lib/python*/ensurepip \
                   lib/python*/turtledemo lib/python*/site-packages/pip* \
                   Lib/test Lib/idlelib Lib/tkinter Lib/ensurepip Lib/turtledemo Lib/site-packages/pip* \
                   DLLs/_tkinter.pyd DLLs/tcl*.dll DLLs/tk*.dll
            find . \( -name '*.a' -o -name '*.pyc' \) -delete
            find . -name __pycache__ -type d -prune -exec rm -rf {} +
          )
          "$PY" -c "import pygame; print('bundled pygame', pygame.version.ver, 'SDL', pygame.version.SDL)"
          echo "PY=$PY" >> "$GITHUB_ENV"
          du -sh payload/runtime/*

      - name: Assemble the payload
        run: |
          BIN=$(sed -nE 's/^name *= *"([^"]*)".*/\1/p' Cargo.toml | head -1) # .* also eats a CR
          EXE=$BIN
          [ "$RUNNER_OS" = Windows ] && EXE=$BIN.exe
          cp "target/${{ matrix.target }}/release/$EXE" payload/
          mkdir payload/src
          find src -maxdepth 1 -type f ! -name '*.rs' -exec cp {} payload/src/ \;
          cp README.md LICENSE THIRD_PARTY_LICENSES.md payload/
          : > "payload/BUILD-$GITHUB_SHA" # stamp: the launchers unpack again only when this changes

          # run.bat / run.sh: put the bundled Python and Java first on PATH, then start the menu
          if [ "$RUNNER_OS" = Windows ]; then
            printf '%s\r\n' \
              '@echo off' \
              'cd /d "%~dp0"' \
              'set "PATH=%~dp0runtime\python;%~dp0runtime\jvm\bin;%PATH%"' \
              "$EXE %*" \
              'if errorlevel 1 pause' > payload/run.bat
          else
            RUN_SCRIPT=run.sh
            [ "$RUNNER_OS" = macOS ] && RUN_SCRIPT=$PROJECT.command # Terminal opens .command files
            cat > "payload/$RUN_SCRIPT" <<EOF
          #!/bin/sh
          HERE=\$(cd "\$(dirname "\$0")" && pwd)
          PATH="\$HERE/runtime/python/bin:\$HERE/runtime/jvm/bin:\$PATH"
          export PATH
          cd "\$HERE" && exec "./$BIN" "\$@"
          EOF
            chmod +x "payload/$RUN_SCRIPT"

            # a plain 256x256 icon, used by the AppImage and the .app
            "$PY" - icon.png <<'PY'
          import struct, sys, zlib
          w = h = 256
          raw = b"".join(b"\x00" + bytes([30, 34, 40]) * w for _ in range(h))
          def chunk(tag, data):
              body = tag + data
              return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body))
          png = (b"\x89PNG\r\n\x1a\n"
                 + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
                 + chunk(b"IDAT", zlib.compress(raw))
                 + chunk(b"IEND", b""))
          open(sys.argv[1], "wb").write(png)
          PY
          fi
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          echo "EXE=$EXE" >> "$GITHUB_ENV"
          ls payload payload/src
          du -sh payload

      - name: Linux - build the AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1" # CI runners have no FUSE
        run: |
          ARCH=$(uname -m)
          OUT=$PROJECT-${{ matrix.name }}.AppImage
          command -v desktop-file-validate >/dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends desktop-file-utils; }

          mkdir AppDir
          cp -R payload AppDir/payload
          cp icon.png "AppDir/$PROJECT.png"

          # First start (or a new build): unpack the game into a per-user folder, then start it from there.
          cat > AppDir/AppRun <<EOF
          #!/bin/sh
          HERE=\$(dirname "\$(readlink -f "\$0")")
          DATA=\${XDG_DATA_HOME:-\$HOME/.local/share}/$PROJECT
          if [ ! -e "\$DATA/BUILD-$GITHUB_SHA" ]; then
            echo "Unpacking $PROJECT into \$DATA ..."
            mkdir -p "\$DATA" && rm -rf "\$DATA/runtime" "\$DATA/src" "\$DATA"/BUILD-*
            cp -R "\$HERE/payload/." "\$DATA/"
          fi
          exec "\$DATA/run.sh" "\$@"
          EOF
          chmod +x AppDir/AppRun

          cat > "AppDir/$PROJECT.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=$PROJECT
          Comment=A menu of small Rust, Python and Java games and tools
          Exec=$BIN
          Icon=$PROJECT
          Categories=Game;
          Terminal=true
          EOF

          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-$ARCH.AppImage"
          curl -fsSL -o runtime-file \
            "https://github.com/AppImage/type2-runtime/releases/download/$APPIMAGE_RUNTIME_VERSION/runtime-$ARCH"
          chmod +x appimagetool
          ./appimagetool --no-appstream --runtime-file runtime-file AppDir "$OUT"
          ls -lh "$OUT"

          echo "RUN=./$OUT" >> "$GITHUB_ENV"
          echo "DATA_DIR=$HOME/.local/share/$PROJECT" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: macOS - build the .app and .dmg
        if: runner.os == 'macOS'
        run: |
          OUT=$PROJECT-${{ matrix.name }}.dmg
          APP=dmgroot/$PROJECT.app
          VERSION=$(sed -nE 's/^version *= *"([^"]*)".*/\1/p' Cargo.toml | head -1)
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R payload "$APP/Contents/Resources/payload"

          # Finder runs this. First start (or a new build): copy the game into a writable folder, then open it in Terminal.
          cat > "$APP/Contents/MacOS/$PROJECT" <<EOF
          #!/bin/sh
          HERE=\$(cd "\$(dirname "\$0")/../Resources/payload" && pwd)
          DATA="\$HOME/Library/Application Support/$PROJECT"
          if [ ! -e "\$DATA/BUILD-$GITHUB_SHA" ]; then
            mkdir -p "\$DATA" && rm -rf "\$DATA/runtime" "\$DATA/src" "\$DATA"/BUILD-*
            ditto --noqtn "\$HERE" "\$DATA" # --noqtn drops the "downloaded from the internet" flag so the bundled tools may run
          fi
          if [ -n "\$CI" ] || [ -t 0 ]; then exec "\$DATA/$PROJECT.command" "\$@"; fi
          exec open -a Terminal "\$DATA/$PROJECT.command"
          EOF
          chmod +x "$APP/Contents/MacOS/$PROJECT"

          mkdir icon.iconset
          sips -z 256 256 icon.png --out icon.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 icon.png --out icon.iconset/icon_512x512.png >/dev/null
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/$PROJECT.icns"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>$PROJECT</string>
            <key>CFBundleDisplayName</key><string>$PROJECT</string>
            <key>CFBundleIdentifier</key><string>io.github.$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]').$PROJECT</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleExecutable</key><string>$PROJECT</string>
            <key>CFBundleIconFile</key><string>$PROJECT</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$APP/Contents/Info.plist"

          cat > "dmgroot/How to open.txt" <<EOF
          Double-click $PROJECT.

          macOS will say it cannot check the app for malware, because it is not signed with an Apple developer account.
          Click Done, open System Settings > Privacy & Security, scroll down and click "Open Anyway" next to $PROJECT.
          That is only needed the first time. The game then opens in a Terminal window.
          EOF

          hdiutil create -volname "$PROJECT" -srcfolder dmgroot -ov -format UDZO "$OUT"
          ls -lh "$OUT"

          # mount it read-only like a user would and test from there
          MOUNT=$RUNNER_TEMP/dmg
          mkdir -p "$MOUNT"
          hdiutil attach "$OUT" -nobrowse -readonly -mountpoint "$MOUNT"
          echo "RUN=$MOUNT/$PROJECT.app/Contents/MacOS/$PROJECT" >> "$GITHUB_ENV"
          echo "DATA_DIR=$HOME/Library/Application Support/$PROJECT" >> "$GITHUB_ENV"

      - name: Windows - build the .exe
        if: runner.os == 'Windows'
        run: |
          OUT=$PROJECT-${{ matrix.name }}.exe
          MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe"
          [ -x "$MAKENSIS" ] || choco install nsis -y --no-progress

          # Single-file download: unpacks the game into %LOCALAPPDATA% the first time (or after an update), then starts it.
          cat > installer.nsi <<'EOF'
          Unicode true
          Name "${NAME}"
          OutFile "${OUT}"
          SilentInstall silent
          RequestExecutionLevel user
          SetCompressor /SOLID lzma
          Section
            StrCpy $INSTDIR "$LOCALAPPDATA\${NAME}"
            IfFileExists "$INSTDIR\BUILD-${BUILD}" start
              Banner::show "Unpacking ${NAME}, this only happens once..."
              RMDir /r "$INSTDIR\runtime"
              RMDir /r "$INSTDIR\src"
              Delete "$INSTDIR\BUILD-*"
              SetOutPath "$INSTDIR"
              File /r "${PAYLOAD}\*"
              Banner::destroy
            start:
            SetOutPath "$INSTDIR"
            Exec '"$SYSDIR\cmd.exe" /c ""$INSTDIR\run.bat""'
          SectionEnd
          EOF
          "$MAKENSIS" -V2 -DNAME="$PROJECT" -DOUT="$OUT" -DBUILD="$GITHUB_SHA" \
                      -DPAYLOAD="$(cygpath -w "$PWD/payload")" installer.nsi
          ls -lh "$OUT"

          # run it like a user would: it unpacks, then opens the game in its own window
          "./$OUT"
          for _ in $(seq 60); do
            if tasklist | grep -i "^$EXE" >/dev/null; then break; fi
            sleep 1
          done
          tasklist | grep -i "^$EXE" >/dev/null || { echo "the game window did not start"; exit 1; }
          taskkill //F //IM "$EXE" >/dev/null
          DATA=$(cygpath "$LOCALAPPDATA")/$PROJECT
          echo "RUN=cmd //c $DATA/run.bat" >> "$GITHUB_ENV"
          echo "DATA_DIR=$DATA" >> "$GITHUB_ENV"

      - name: Test the download end to end
        run: |
          expect() { # expect <text the output must contain> <menu inputs...>
            out=$(printf '%s\n' "${@:2}" | $RUN 2>&1) || true
            if printf '%s\n' "$out" | grep "$1" >/dev/null; then
              echo "ok: $1"
            else
              printf '%s\n' "$out"
              echo "FAILED: expected '$1' in the output"
              exit 1
            fi
          }
          echo "--- the download unpacks itself and the menu lists the games ---"
          expect 'wordle' --help exit
          echo "--- a Python program starts through the bundled interpreter ---"
          expect 'prime number checker' 6 n
          echo "--- the Java game starts through the bundled JVM ---"
          expect 'Welcome' 3 n
          echo "--- everything landed in the per-user folder ---"
          test -f "$DATA_DIR/src/words.txt"
          ls "$DATA_DIR"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT }}-${{ matrix.name }}
          path: ${{ env.PROJECT }}-${{ matrix.name }}.*
          if-no-files-found: error
          compression-level: 0 # already compressed
          retention-days: 7

  release:
    name: release
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lh dist
          count=$(find dist -type f | wc -l)
          [ "$count" -eq 6 ] || { echo "expected 6 downloads, got $count"; exit 1; }

          cat > notes.md <<EOF
          ## How to run
          Everything is included (Python, pygame and Java), there is nothing else to install.
          - **Windows**: download the \`.exe\` for your PC (x86_64 for most PCs, arm64 for Snapdragon laptops) and double-click it. Windows warns about an unknown publisher: click "More info", then "Run anyway". The first start unpacks the game, after that it starts right away.
          - **macOS**: download the \`.dmg\` (arm64 for Apple Silicon, x86_64 for Intel Macs), open it and double-click $PROJECT. macOS refuses the first time: open System Settings > Privacy & Security and click "Open Anyway". The dmg also contains "How to open.txt".
          - **Linux**: download the \`.AppImage\`, make it executable (right-click > Properties, or \`chmod +x\`) and run it from a terminal.
          EOF

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --notes-file notes.md
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*

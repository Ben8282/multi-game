name: build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  PROJECT: ${{ github.event.repository.name }}
  PYTHON_VERSION: "3.13"
  JDK_VERSION: "21"
  JAVA_RELEASE: "17"
  JAVA_ENCODING: "UTF-8"
  APPIMAGETOOL_VERSION: "1.9.0"

jobs:
  java:
    name: java bytecode
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      - name: Compile every Java source in the repo
        run: |
          set -e
          sources=$(find src -name '*.java')
          if [ -z "$sources" ]; then
            echo "no .java files found under src/"
            exit 1
          fi
          echo "compiling:"; echo "$sources" | sed 's/^/  /'
          mkdir -p build/classes
          javac -encoding "$JAVA_ENCODING" --release "$JAVA_RELEASE" -d build/classes $sources

      - name: Verify every class loads
        run: |
          set -e
          cd build/classes
          find . -name '*.class' ! -name '*$*' -print0 | while IFS= read -r -d '' c; do
            name=$(echo "${c#./}" | sed 's/\.class$//; s|/|.|g')
            echo "checking $name"
            javap -cp . "$name" > /dev/null
          done

      - uses: actions/upload-artifact@v5
        with:
          name: java-classes
          path: build/classes
          if-no-files-found: error
          retention-days: 1

  python:
    name: python ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-24.04
          - name: windows
            runner: windows-latest
          - name: macos
            runner: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          set -e
          if [ -f requirements.txt ]; then
            python -m pip install --disable-pip-version-check -r requirements.txt
          else
            echo "no requirements.txt, falling back to pygame-ce"
            python -m pip install --disable-pip-version-check pygame-ce
          fi

      - name: Byte-compile every script
        run: python -m compileall -q src

      - name: Import every third-party dependency
        run: |
          set -e
          mods=$(grep -rhoE '^[[:space:]]*(import|from)[[:space:]]+[a-zA-Z_][a-zA-Z0-9_]*' src --include='*.py' \
                 | awk '{print $2}' | sort -u)
          for m in $mods; do
            if [ -f "src/$m.py" ]; then continue; fi
            python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('$m') else 1)" \
              || { echo "missing module: $m"; exit 1; }
            echo "ok: $m"
          done

      - name: Run scripted smoke tests
        run: |
          set -e
          if [ ! -d .github/smoke ]; then
            echo "no .github/smoke directory, skipping"
            exit 0
          fi
          for input in .github/smoke/*.in; do
            [ -e "$input" ] || continue
            script="src/$(basename "$input" .in).py"
            if [ ! -f "$script" ]; then
              echo "$input has no matching $script"
              exit 1
            fi
            echo "running $script"
            python "$script" < "$input" > /dev/null
          done
          rm -f password.txt

      - name: Run every graphical script headless
        if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -e
          scripts=$(grep -rl 'pygame' src --include='*.py' || true)
          for s in $scripts; do
            echo "running $s for 10s"
            set +e
            timeout 10 python "$s"
            code=$?
            set -e
            if [ "$code" -ne 124 ]; then
              echo "$s exited early with code $code instead of running its loop"
              exit 1
            fi
          done

  build:
    name: ${{ matrix.name }}
    needs: java
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      - uses: astral-sh/setup-uv@v6

      - name: Build and test
        run: |
          set -e
          cargo build --release --target ${{ matrix.target }}
          cargo test --release --target ${{ matrix.target }}

      - uses: actions/download-artifact@v6
        with:
          name: java-classes
          path: build/classes

      - name: Bundle a minimal Java runtime
        run: |
          set -e
          jlink --add-modules java.base \
                --strip-debug --no-header-files --no-man-pages \
                --output runtime/jvm
          runtime/jvm/bin/java -version

      - name: Bundle a standalone Python with the project's dependencies
        run: |
          set -e
          uv python install --install-dir pydist "$PYTHON_VERSION"
          src_dir=$(ls -d pydist/cpython-*/ | grep -E 'cpython-[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "using $src_dir"
          mkdir -p runtime
          cp -a "${src_dir%/}" runtime/python

          if [ -x runtime/python/bin/python3 ]; then
            PY=runtime/python/bin/python3
          else
            PY=runtime/python/python.exe
          fi
          echo "PY=$PY" >> "$GITHUB_ENV"

          if [ -f requirements.txt ]; then
            uv pip install --python "$PY" --break-system-packages -r requirements.txt
          else
            uv pip install --python "$PY" --break-system-packages pygame-ce
          fi

          rm -rf runtime/python/include runtime/python/share \
                 runtime/python/lib/python*/test runtime/python/Lib/test \
                 runtime/python/lib/python*/idlelib runtime/python/Lib/idlelib \
                 runtime/python/lib/python*/tkinter runtime/python/Lib/tkinter \
                 runtime/python/lib/python*/ensurepip runtime/python/Lib/ensurepip
          find runtime/python \( -name '*.a' -o -name '*.pyc' \) -delete 2>/dev/null || true
          find runtime/python -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true

          "$PY" -c "import pygame; print('bundled pygame', pygame.version.ver, 'SDL', pygame.version.SDL)"
          du -sh runtime/python runtime/jvm

      - name: Assemble bundle
        run: |
          set -e
          BIN=$(grep -m1 '^name' Cargo.toml | tr -d '\r' | sed -E 's/.*"(.*)".*/\1/')
          EXE="$BIN"
          if [ "${{ runner.os }}" = "Windows" ]; then EXE="$BIN.exe"; fi
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          echo "EXE=$EXE" >> "$GITHUB_ENV"

          BUNDLE="dist/$PROJECT-${{ matrix.name }}"
          mkdir -p "$BUNDLE/src"
          cp "target/${{ matrix.target }}/release/$EXE" "$BUNDLE/$EXE"
          chmod +x "$BUNDLE/$EXE"
          cp -a runtime "$BUNDLE/runtime"
          cp -a build/classes/. "$BUNDLE/"
          cp src/*.py "$BUNDLE/src/"
          for doc in README.md LICENSE THIRD_PARTY_LICENSES.md requirements.txt; do
            if [ -f "$doc" ]; then cp "$doc" "$BUNDLE/"; fi
          done
          cat > "$BUNDLE/HOW-TO-RUN.txt" <<EOF
          Nothing to install. Open a terminal in THIS folder and run:

            ./$EXE

          Python, pygame and Java are all included in runtime/ and are used
          automatically. Start it from this folder so it can find src/ and
          the .class files next to it.
          EOF
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          du -sh "$BUNDLE"

      - name: Run the bundled launcher end to end
        run: |
          set -e
          cd "$BUNDLE"
          echo "--- menu loads ---"
          printf -- '--help\nexit\n' | "./$EXE"
          echo "--- a Python program runs through the bundled interpreter ---"
          printf -- '6\n7\nn\n' | "./$EXE"
          echo "--- bundled JVM loads the compiled class ---"
          ./runtime/jvm/bin/java -version

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.PROJECT }}-${{ matrix.name }}
          path: dist/${{ env.PROJECT }}-${{ matrix.name }}
          if-no-files-found: error
          retention-days: ${{ startsWith(matrix.name, 'linux') && 1 || 90 }}

  appimage:
    name: appimage-${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            bundle: linux-x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            bundle: linux-arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          name: ${{ env.PROJECT }}-${{ matrix.bundle }}
          path: bundle

      - name: Install appimagetool prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils

      - name: Assemble the AppDir
        run: |
          set -e
          BIN=$(grep -m1 '^name' Cargo.toml | tr -d '\r' | sed -E 's/.*"(.*)".*/\1/')

          mkdir -p "AppDir/usr/bin" "AppDir/usr/share/$PROJECT"
          install -m 755 "bundle/$BIN" "AppDir/usr/bin/$BIN"
          mv bundle/runtime "AppDir/usr/bin/runtime"
          rm -f "bundle/$BIN"
          cp -a bundle/. "AppDir/usr/share/$PROJECT/"

          cat > AppDir/AppRun <<EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          DATA="\${XDG_DATA_HOME:-\$HOME/.local/share}/$PROJECT"
          mkdir -p "\$DATA" || exit 1
          cp -R "\$HERE/usr/share/$PROJECT/." "\$DATA/" || exit 1
          cd "\$DATA" || exit 1
          exec "\$HERE/usr/bin/$BIN" "\$@"
          EOF
          chmod +x AppDir/AppRun

          cat > "AppDir/$PROJECT.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=$PROJECT
          Comment=A menu of small Rust, Python and Java programs
          Exec=$BIN
          Icon=$PROJECT
          Categories=Game;
          Terminal=true
          EOF

          python3 - "$PROJECT" <<'PY'
          import struct, sys, zlib
          w = h = 256
          raw = b"".join(b"\x00" + bytes([30, 34, 40]) * w for _ in range(h))
          def chunk(tag, data):
              body = tag + data
              return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body))
          png = (b"\x89PNG\r\n\x1a\n"
                 + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
                 + chunk(b"IDAT", zlib.compress(raw))
                 + chunk(b"IEND", b""))
          open("AppDir/" + sys.argv[1] + ".png", "wb").write(png)
          PY

      - name: Build the AppImage
        env:
          ARCH: ${{ matrix.arch }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -e
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x appimagetool
          curl -fsSL -o runtime-file \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${{ matrix.arch }}"
          ./appimagetool -n --runtime-file runtime-file AppDir "$PROJECT-${{ matrix.bundle }}.AppImage"
          ls -lh "$PROJECT-${{ matrix.bundle }}.AppImage"

      - name: Run the AppImage end to end
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -e
          printf -- '--help\nexit\n' | "./$PROJECT-${{ matrix.bundle }}.AppImage"
          printf -- '6\n7\nn\n' | "./$PROJECT-${{ matrix.bundle }}.AppImage"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.PROJECT }}-${{ matrix.bundle }}-appimage
          path: ${{ env.PROJECT }}-${{ matrix.bundle }}.AppImage
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [java, python, build, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Package the release files
        run: |
          set -e
          mkdir -p dist
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            case "$name" in
              *-appimage)
                base="${name%-appimage}"
                mv "$name"/*.AppImage "../dist/$base.AppImage"
                chmod +x "../dist/$base.AppImage"
                ;;
              *windows*)
                (cd "$name" && zip -qr "../../dist/$name.zip" .)
                ;;
              *macos*)
                chmod +x "$name"/* 2>/dev/null || true
                chmod -R +x "$name/runtime" 2>/dev/null || true
                tar -czf "../dist/$name.tar.gz" -C "$name" .
                ;;
              *)
                echo "skipping intermediate artifact: $name"
                ;;
            esac
          done
          echo
          ls -lh ../dist
          count=$(ls -1 ../dist | wc -l)
          if [ "$count" -ne 5 ]; then
            echo "expected 5 release files, got $count"
            exit 1
          fi

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*

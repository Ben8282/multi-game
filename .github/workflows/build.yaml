name: build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  PROJECT: ${{ github.event.repository.name }}
  PYTHON_VERSION: "3.13"
  JDK_VERSION: "21"
  JAVA_RELEASE: "17"
  JAVA_ENCODING: "UTF-8"
  APPIMAGETOOL_VERSION: "1.9.0"

jobs:
  java:
    name: java bytecode
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      - name: Compile every Java source in the repo
        run: |
          set -e
          sources=$(find src -name '*.java')
          if [ -z "$sources" ]; then
            echo "no .java files found under src/"
            exit 1
          fi
          echo "compiling:"; echo "$sources" | sed 's/^/  /'
          mkdir -p build/classes
          javac -encoding "$JAVA_ENCODING" --release "$JAVA_RELEASE" -d build/classes $sources

      - name: Verify every class loads
        run: |
          set -e
          cd build/classes
          find . -name '*.class' ! -name '*$*' -print0 | while IFS= read -r -d '' c; do
            name=$(echo "${c#./}" | sed 's/\.class$//; s|/|.|g')
            echo "checking $name"
            javap -cp . "$name" > /dev/null
          done

      - uses: actions/upload-artifact@v5
        with:
          name: java-classes
          path: build/classes
          if-no-files-found: error

  python:
    name: python ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-24.04
          - name: windows
            runner: windows-latest
          - name: macos
            runner: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Provide a python3 command on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          $dir = Split-Path $py
          if (-not (Test-Path "$dir\python3.exe")) { Copy-Item $py "$dir\python3.exe" }
          python3 --version

      - name: Install Python dependencies
        shell: bash
        run: |
          set -e
          if [ -f requirements.txt ]; then
            python -m pip install --disable-pip-version-check -r requirements.txt
          else
            echo "no requirements.txt, falling back to pygame"
            python -m pip install --disable-pip-version-check pygame
          fi

      - name: Byte-compile every script
        shell: bash
        run: python -m compileall -q src

      - name: Import every third-party dependency
        shell: bash
        run: |
          set -e
          mods=$(grep -rhoE '^[[:space:]]*(import|from)[[:space:]]+[a-zA-Z_][a-zA-Z0-9_]*' src --include='*.py' \
                 | awk '{print $2}' | sort -u)
          for m in $mods; do
            if [ -f "src/$m.py" ]; then continue; fi
            python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('$m') else 1)" \
              || { echo "missing module: $m"; exit 1; }
            echo "ok: $m"
          done

      - name: Run scripted smoke tests
        shell: bash
        run: |
          set -e
          if [ ! -d .github/smoke ]; then
            echo "no .github/smoke directory, skipping"
            exit 0
          fi
          ran=0
          for input in .github/smoke/*.in; do
            [ -e "$input" ] || continue
            script="src/$(basename "$input" .in).py"
            if [ ! -f "$script" ]; then
              echo "$input has no matching $script"
              exit 1
            fi
            echo "running $script"
            python3 "$script" < "$input" > /dev/null
            ran=$((ran + 1))
          done
          echo "$ran scripted test(s) passed"
          rm -f password.txt

      - name: Run every graphical script headless
        if: runner.os == 'Linux'
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -e
          scripts=$(grep -rl 'pygame' src --include='*.py' || true)
          if [ -z "$scripts" ]; then
            echo "no pygame scripts found"
            exit 0
          fi
          for s in $scripts; do
            echo "running $s for 10s"
            set +e
            timeout 10 python3 "$s"
            code=$?
            set -e
            if [ "$code" -ne 124 ]; then
              echo "$s exited early with code $code instead of running its loop"
              exit 1
            fi
          done

  build:
    name: ${{ matrix.name }}
    needs: java
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: linux-x86
            runner: ubuntu-24.04
            target: i686-unknown-linux-gnu
            apt: gcc-multilib
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-x86
            runner: windows-latest
            target: i686-pc-windows-msvc
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v5

      - name: Install 32-bit toolchain
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Read the binary name from Cargo.toml
        if: runner.os != 'Windows'
        id: meta_unix
        shell: bash
        run: |
          bin=$(grep -m1 '^name' Cargo.toml | tr -d '\r' | sed -E 's/.*"(.*)".*/\1/')
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          echo "binary name: $bin"

      - name: Read the binary name from Cargo.toml
        if: runner.os == 'Windows'
        id: meta_win
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^name' | Select-Object -First 1
          $bin = [regex]::Match($line.Line, '"(.*)"').Groups[1].Value
          "bin=$bin" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "binary name: $bin"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Test
        run: cargo test --release --target ${{ matrix.target }}

      - uses: actions/download-artifact@v6
        with:
          name: java-classes
          path: build/classes

      - name: Smoke test the launcher
        if: runner.os != 'Windows'
        shell: bash
        env:
          BIN: ${{ steps.meta_unix.outputs.bin }}
        run: |
          set -e
          exe="target/${{ matrix.target }}/release/$BIN"
          chmod +x "$exe"
          printf -- '--help\nexit\n' | "$exe"

      - name: Smoke test the launcher
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BIN: ${{ steps.meta_win.outputs.bin }}
        run: |
          $exe = "target\${{ matrix.target }}\release\$env:BIN.exe"
          @('--help', 'exit') | & $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble bundle
        if: runner.os != 'Windows'
        shell: bash
        env:
          BIN: ${{ steps.meta_unix.outputs.bin }}
        run: |
          set -e
          BUNDLE="dist/$PROJECT-${{ matrix.name }}"
          mkdir -p "$BUNDLE/src"
          install -m 755 "target/${{ matrix.target }}/release/$BIN" "$BUNDLE/$BIN"
          cp -r build/classes/. "$BUNDLE/"
          cp src/*.py "$BUNDLE/src/"
          for doc in README.md LICENSE THIRD_PARTY_LICENSES.md requirements.txt; do
            if [ -f "$doc" ]; then cp "$doc" "$BUNDLE/"; fi
          done
          cat > "$BUNDLE/HOW-TO-RUN.txt" <<EOF
          Open a terminal in THIS folder and run ./$BIN

          It has to be started from this folder. The launcher looks for
          src/*.py and the .class files relative to where you started it.

          You also need these installed on your machine:
            python3   for the Python programs
            pygame    for the ones that open a window
            java      for the Java program (Java $JAVA_RELEASE or newer)

          The Rust programs need nothing extra.
          EOF
          ls -R "$BUNDLE"

      - name: Assemble bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BIN: ${{ steps.meta_win.outputs.bin }}
        run: |
          $bundle = "dist\$env:PROJECT-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path "$bundle\src" | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\$env:BIN.exe" $bundle
          Copy-Item -Recurse -Force "build\classes\*" $bundle
          Copy-Item src\*.py "$bundle\src"
          foreach ($doc in 'README.md', 'LICENSE', 'THIRD_PARTY_LICENSES.md', 'requirements.txt') {
            if (Test-Path $doc) { Copy-Item $doc $bundle }
          }
          @"
          Open PowerShell in THIS folder and run .\$env:BIN.exe

          It has to be started from this folder. The launcher looks for
          src\*.py and the .class files relative to where you started it.

          You also need these installed on your machine:
            python3   for the Python programs
            pygame    for the ones that open a window
            java      for the Java program (Java $env:JAVA_RELEASE or newer)

          Windows does not provide a python3 command by default. See the
          Windows section of README.md for the one-line fix.

          The Rust programs need nothing extra.
          "@ | Set-Content "$bundle\HOW-TO-RUN.txt"
          Get-ChildItem -Recurse $bundle | Select-Object FullName

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.PROJECT }}-${{ matrix.name }}
          path: dist/${{ env.PROJECT }}-${{ matrix.name }}
          if-no-files-found: error

  appimage:
    name: appimage-${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            bundle: linux-x86_64
            tool: x86_64
            jre: "yes"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            bundle: linux-arm64
            tool: aarch64
            jre: "yes"
          - arch: i686
            runner: ubuntu-24.04
            bundle: linux-x86
            tool: x86_64
            jre: "no"
            apt: libc6-i386
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        if: matrix.jre == 'yes'
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      - uses: actions/download-artifact@v6
        with:
          name: ${{ env.PROJECT }}-${{ matrix.bundle }}
          path: bundle

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils ${{ matrix.apt }}

      - name: Build a minimal Java runtime
        if: matrix.jre == 'yes'
        run: |
          jlink --add-modules java.base \
                --strip-debug --no-header-files --no-man-pages \
                --output jre
          ./jre/bin/java -version

      - name: Assemble the AppDir
        run: |
          set -e
          BIN=$(grep -m1 '^name' Cargo.toml | tr -d '\r' | sed -E 's/.*"(.*)".*/\1/')

          mkdir -p "AppDir/usr/bin" "AppDir/usr/share/$PROJECT" "AppDir/usr/lib"
          install -m 755 "bundle/$BIN" "AppDir/usr/bin/$BIN"
          rm -f "bundle/$BIN"
          cp -r bundle/. "AppDir/usr/share/$PROJECT/"
          if [ -d jre ]; then cp -r jre "AppDir/usr/lib/jvm"; fi

          cat > AppDir/AppRun <<EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          DATA="\${XDG_DATA_HOME:-\$HOME/.local/share}/$PROJECT"
          mkdir -p "\$DATA" || exit 1
          cp -R "\$HERE/usr/share/$PROJECT/." "\$DATA/" || exit 1
          if [ -x "\$HERE/usr/lib/jvm/bin/java" ]; then
            PATH="\$HERE/usr/lib/jvm/bin:\$PATH"
            export PATH
          fi
          cd "\$DATA" || exit 1
          exec "\$HERE/usr/bin/$BIN" "\$@"
          EOF
          chmod +x AppDir/AppRun

          cat > "AppDir/$PROJECT.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=$PROJECT
          Comment=A menu of small Rust, Python and Java programs
          Exec=$BIN
          Icon=$PROJECT
          Categories=Game;
          Terminal=true
          EOF

          python3 - "$PROJECT" <<'PY'
          import struct, sys, zlib
          w = h = 256
          raw = b"".join(b"\x00" + bytes([30, 34, 40]) * w for _ in range(h))
          def chunk(tag, data):
              body = tag + data
              return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body))
          png = (b"\x89PNG\r\n\x1a\n"
                 + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
                 + chunk(b"IDAT", zlib.compress(raw))
                 + chunk(b"IEND", b""))
          open("AppDir/" + sys.argv[1] + ".png", "wb").write(png)
          PY

      - name: Build the AppImage
        env:
          ARCH: ${{ matrix.arch }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -e
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${{ matrix.tool }}.AppImage"
          chmod +x appimagetool
          curl -fsSL -o runtime \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${{ matrix.arch }}"
          ./appimagetool -n --runtime-file runtime AppDir "$PROJECT-${{ matrix.bundle }}.AppImage"
          file "$PROJECT-${{ matrix.bundle }}.AppImage"

      - name: Smoke test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: printf -- '--help\nexit\n' | "./$PROJECT-${{ matrix.bundle }}.AppImage"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.PROJECT }}-${{ matrix.bundle }}-appimage
          path: ${{ env.PROJECT }}-${{ matrix.bundle }}.AppImage
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [java, python, build, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Package the eight release files
        run: |
          set -e
          mkdir -p dist
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            case "$name" in
              *-appimage)
                base="${name%-appimage}"
                mv "$name"/*.AppImage "../dist/$base.AppImage"
                chmod +x "../dist/$base.AppImage"
                ;;
              *windows*)
                (cd "$name" && zip -qr "../../dist/$name.zip" .)
                ;;
              *macos*)
                find "$name" -maxdepth 1 -type f \
                  ! -name '*.txt' ! -name '*.md' ! -name 'LICENSE' ! -name '*.class' \
                  -exec chmod +x {} +
                tar -czf "../dist/$name.tar.gz" -C "$name" .
                ;;
              *)
                echo "skipping intermediate artifact: $name"
                ;;
            esac
          done
          echo
          ls -lh ../dist
          count=$(ls -1 ../dist | wc -l)
          echo "$count release files"
          if [ "$count" -ne 8 ]; then
            echo "expected 8 release files"
            exit 1
          fi

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
